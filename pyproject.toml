[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "image-gallery-browser"
version = "0.1.0"
description = "Browse local image folders with Streamlit, Pillow thumbnails, and SQLite indexing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "streamlit==1.58.0",
    "pillow==12.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.17",
]

[tool.setuptools.packages.find]
include = ["image_gallery_browser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
